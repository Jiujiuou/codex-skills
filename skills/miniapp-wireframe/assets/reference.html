    let content='';
    if(state.modal==='purchase')content=`<div class="sheet-eyebrow">ONE TEMPLATE, MANY LITTLE STORIES</div><h2 class="sheet-title">把这份喜欢，留下来。</h2><div class="sheet-description">解锁「${current().name}」，保存这次的作品，<br>以后也可以用它制作新的心意。</div><div class="sheet-preview">${patternSvg(current(),true)}</div><div class="sheet-benefit">${icon('check')}这一套模板可重复使用</div><div class="sheet-benefit">${icon('check')}包含整张图与分页导出权益</div><div class="sheet-total"><span>一次解锁 · 无订阅</span><strong>¥ 0.99</strong></div><button class="primary wide" data-action="pay">模拟支付 ¥ 0.99 ${icon('arrow')}</button><div class="disclaimer">交互原型演示 · 不会扣款，不产生真实订单</div>`;
    if(state.modal==='success')content=`<div class="success-sheet"><div class="success-mark">${icon('check')}</div><div class="sheet-eyebrow">A LITTLE PAPER, READY TO GO</div><h2 class="sheet-title">心意，可以出发了。</h2><p class="sheet-description">${current().price?'模板已在本原型中解锁，可重复使用。':'免费模板可以自由使用。'}<br>这份线稿样张已准备好。</p><button class="primary wide" data-action="download">${icon('download')}下载线稿样张</button><button class="secondary wide" data-action="to-mine">去我的作品 ${icon('arrow')}</button><div class="disclaimer">样张为 SVG 文件；PNG / PDF 为产品流程示意。</div></div>`;
    if(state.modal==='help'){
      const printing=state.modalData==='printing';
      content=`<div class="sheet-eyebrow">A SMALL GUIDE</div><h2 class="sheet-title">${printing?'从屏幕，到一张纸。':'喜欢的模板，可以留下。'}</h2><div class="help-sheet-content">${printing?'整张高清图：适合交给能打印大幅纸张的门店，先确认纸张尺寸。<br><br>A4 分页打印：适合普通打印机，按页码排列并拼接。正式产品需提供裁切与拼接标记。<br><br>当前是界面线稿，下载仅提供 SVG 示意样张。':'免费模板可直接导出。付费模板可先编辑并预览，满意后再解锁。<br><br>本方案按模板一次购买，可重复使用；下载中断后可重新导出。<br><br>当前支付是演示，不会真实扣款。演示购买记录仅保存在当前浏览器。'}</div><button class="secondary wide" data-action="close-modal">知道了</button>`;
    }
    host.innerHTML=`<div class="modal-backdrop"><section class="bottom-sheet" role="dialog" aria-modal="true" aria-label="${state.modal==='purchase'?'模板解锁确认':state.modal==='success'?'作品导出完成':'使用说明'}"><div class="sheet-grip"></div>${close}${content}</section></div>`;
    host.querySelector('button')?.focus({preventScroll:true});
  }
  function refreshPaper(){
    document.querySelectorAll('.paper-preview').forEach(el=>{const svg=el.querySelector('svg');if(svg)svg.outerHTML=patternSvg(current());});
  }
  function toast(message){
    clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=message;document.querySelector('.device').append(el);toastTimer=setTimeout(()=>el.remove(),2600);
  }
  function choose(id){const t=templates.find(t=>t.id===id);if(!t)return;state.template=id;state.draftId=null;state.pattern=t.pattern;state.stickers=t.style==='party'?['hat']:t.style==='heart'?['heart']:[];state.frame=t.style==='simple'?'无框':'花边';state.screen='editor';state.modal=null;renderScreen();}
  function saveDraft(showToast=true){
    if(!state.draftId)state.draftId='draft-'+Date.now();
    const draft={id:state.draftId,template:state.template,name:state.copy.split('\n')[0]||current().name,copy:state.copy,font:state.font,textSize:state.textSize,spacing:state.spacing,imageScale:state.imageScale,paper:state.paper,frame:state.frame,stickers:[...state.stickers],bg:state.bg,pattern:state.pattern,photo:state.photo};
    const old=state.drafts.findIndex(d=>d.id===state.draftId);if(old>=0)state.drafts[old]=draft;else state.drafts.unshift(draft);persist();if(showToast)toast('草稿已保存在当前浏览器');
  }
  function downloadSample(){
    const svg=patternSvg(current()).replace('viewBox="0 0 700 500"','viewBox="0 0 700 500" width="1400" height="1000"');
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`Mengmeng-${current().id}-wireframe.svg`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('线稿样张已生成 · SVG 格式');
  }
  function fit(){
    const baseW=landscape?844:390,baseH=landscape?390:812;
    const stage=document.querySelector('.stage');if(!stage)return;
    const availableW=stage.clientWidth;const small=innerWidth<650;
    const availableH=small?Math.max(420,innerHeight-190):Math.max(390,innerHeight-238);
    const scale=state.scaleMode==='actual'?1:Math.max(.25,Math.min(1,availableW/baseW,availableH/baseH));
    const wrap=document.querySelector('.device-wrap');wrap.style.width=`${baseW*scale}px`;wrap.style.height=`${baseH*scale}px`;document.querySelector('.device').style.transform=`scale(${scale})`;
    document.querySelectorAll('[data-action="scale"]').forEach(b=>b.classList.toggle('active',b.dataset.value===state.scaleMode));
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b)return;
    const {action,value}=b.dataset;
    if(action==='orientation'){directionMode=value;applyOrientation();}
    else if(action==='screen'){state.screen=value;state.modal=null;renderScreen();}
    else if(action==='scale'){state.scaleMode=value;fit();}
    else if(action==='category'){state.category=value;renderScreen();}
    else if(action==='choose-template')choose(value);
    else if(action==='tool'){state.tool=value;renderScreen();}
    else if(action==='frame'){state.frame=value;renderScreen();}
    else if(action==='font'){state.font=value;renderScreen();}
    else if(action==='sticker'){state.stickers=state.stickers.includes(value)?state.stickers.filter(s=>s!==value):[...state.stickers,value];renderScreen();}
    else if(action==='color'){state.bg=value;renderScreen();}
    else if(action==='pattern'){state.pattern=value;renderScreen();}
    else if(action==='paper'){state.paper=value;renderScreen();}
    else if(action==='format'){state.format=value;renderScreen();}
    else if(action==='upload')document.getElementById('photo-file').click();
    else if(action==='custom-sticker')toast('自定义装饰入口示意 · 第一版使用内置素材');
    else if(action==='zoom'){state.zoom=!state.zoom;document.querySelector('.paper-preview')?.classList.toggle('zoomed',state.zoom);}
    else if(action==='save')saveDraft();
    else if(action==='export'){state.modal=purchased()?'success':'purchase';renderModal();}
    else if(action==='pay'){if(!state.owned.includes(state.template))state.owned.push(state.template);saveDraft(false);state.modal='success';renderScreen();}
    else if(action==='download')downloadSample();
    else if(action==='close-modal'){state.modal=null;renderModal();}
    else if(action==='mine-tab'){state.mineTab=value;renderScreen();}
    else if(action==='to-mine'){state.modal=null;state.screen='mine';state.mineTab='drafts';renderScreen();}
    else if(action==='open-item'){
      if(state.mineTab==='owned')choose(state.owned[Number(value)]);
      else{const d=state.drafts[Number(value)];if(d){Object.assign(state,{draftId:d.id,template:d.template,copy:d.copy,font:d.font,textSize:d.textSize,spacing:d.spacing,imageScale:d.imageScale,paper:d.paper,frame:d.frame,stickers:[...d.stickers],bg:d.bg,pattern:d.pattern,photo:d.photo||null,screen:'editor'});renderScreen();}}
    }
    else if(action==='help'){state.modal='help';state.modalData=value;renderModal();}
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='copy-input'){state.copy=e.target.value;refreshPaper();}
    if(e.target.dataset.range){state[e.target.dataset.range]=Number(e.target.value);e.target.nextElementSibling.textContent=e.target.value;refreshPaper();}
    if(e.target.id==='custom-color'){state.bg=e.target.value;refreshPaper();}
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='photo-file'&&e.target.files[0]){
      const file=e.target.files[0];if(!file.type.startsWith('image/')){toast('请选择图片文件');return;}if(file.size>10*1024*1024){toast('请选择小于 10 MB 的图片');return;}
      const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=384;canvas.height=384;const ctx=canvas.getContext('2d');const side=Math.min(img.width,img.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,384,384);ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,384,384);state.photo=canvas.toDataURL('image/jpeg',.82);state.tool='person';renderScreen();toast('照片已加入预览 · 仅在本地读取');};img.onerror=()=>toast('这张图片暂时无法读取，请换一张');img.src=reader.result;};reader.readAsDataURL(file);
    }
    if(e.target.id==='custom-color')renderScreen();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&state.modal){state.modal=null;renderModal();}
    if(e.key==='Tab'&&state.modal){const nodes=[...document.querySelectorAll('.bottom-sheet button')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
  });
  function applyOrientation(){
    const next=directionMode==='auto'?innerWidth>innerHeight:directionMode==='landscape';
    if(next!==landscape){landscape=next;document.body.dataset.orientation=next?'landscape':'portrait';renderShell();}
    else {document.querySelectorAll('[data-action="orientation"]').forEach(b=>b.classList.toggle('active',b.dataset.value===directionMode));fit();}
  }
  window.addEventListener('resize',()=>{
    if(document.activeElement?.matches('textarea,input:not([type="range"]):not([type="color"])')){fit();return;}
    applyOrientation();
  });
  document.addEventListener('focusout',()=>requestAnimationFrame(applyOrientation));
  renderShell();
})();
</script></body></html>
